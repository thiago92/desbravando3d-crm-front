<header class="crm-top-bar">
  <div class="crm-top-bar-inner">
    <button
      type="button"
      class="crm-icon-button crm-mobile-menu-button"
      aria-label="Abrir menu de navegação"
      aria-controls="crm-sidebar"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuToggle.emit()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
    <div class="flex min-w-0 items-center gap-3">
      <span class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-fuchsia-600 via-violet-600 to-blue-600 text-sm font-bold text-white shadow-sm" aria-hidden="true">D</span>
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold leading-5">Desbravando 3D</p>
        <p class="text-xs leading-4 crm-muted">CRM</p>
      </div>
    </div>
    <span class="crm-preview-badge">Prévia</span>
  </div>
</header>
